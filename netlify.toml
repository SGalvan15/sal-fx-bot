[build]
  functions = "netlify/functions"

# NOTE: analyze.js scans 28 pairs and can exceed the free-plan 10s function
# timeout. Netlify Pro raises the synchronous function timeout to 26s (set in
# the Netlify UI — it is not configurable from this file). The engine also
# self-guards at 20s and returns partial results instead of dying.

[[redirects]]
  from = "/api/calendar"
  to = "/.netlify/functions/calendar"
  status = 200

[[redirects]]
  from = "/api/prices"
  to = "/.netlify/functions/prices"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200

[[redirects]]
  from = "/api/candles"
  to = "/.netlify/functions/candles"
  status = 200

[[redirects]]
  from = "/api/cbrates"
  to = "/.netlify/functions/cbrates"
  status = 200

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
