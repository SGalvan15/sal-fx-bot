<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SAL FX BOT"/>
<title>SAL FX BOT INPUT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0e1a;font-family:monospace;}
#loading{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0a0e1a;}
.logo{font-size:26px;font-weight:900;letter-spacing:8px;color:#d4af37;}
.sub{font-size:10px;color:#4a6a8a;letter-spacing:3px;}
.bar{width:220px;height:2px;background:#1a2a3a;border-radius:2px;overflow:hidden;}
.fill{height:100%;background:#d4af37;border-radius:2px;width:0;transition:width 0.4s;}
.msg{font-size:9px;color:#2a4a6a;letter-spacing:1px;margin-top:4px;}
</style>
</head>
<body>
<div id="loading">
  <div class="logo">A X I O M</div>
  <div class="sub">SAL FX BOT INPUT</div>
  <div class="bar"><div class="fill" id="bar"></div></div>
  <div class="msg" id="msg">Starting...</div>
</div>
<div id="root"></div>

<script>
var bar=document.getElementById('bar');
var msg=document.getElementById('msg');
function setBar(p,t){bar.style.width=p+'%';msg.textContent=t;}
function showErr(e){
  document.getElementById('loading').innerHTML=
    '<div style="color:#ff4560;padding:40px;font-size:12px;max-width:600px;line-height:2;text-align:center">'+
    '<div style="font-size:20px;color:#d4af37;letter-spacing:6px;margin-bottom:16px">A X I O M</div>'+
    '<strong>Error:</strong> '+e+'<br><br>'+
    '<span style="color:#4a6a8a;font-size:10px">Try: Ctrl+Shift+R to hard refresh</span></div>';
}

// Try multiple CDN sources for each library
function tryLoadScript(urls, cb){
  var i=0;
  function next(){
    if(i>=urls.length){cb(new Error('All CDNs failed'));return;}
    var s=document.createElement('script');
    s.src=urls[i++];
    s.onload=function(){cb(null);};
    s.onerror=function(){next();};
    document.head.appendChild(s);
  }
  next();
}

setBar(5,'Loading React...');
tryLoadScript([
  'https://unpkg.com/react@18/umd/react.production.min.js',
  'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js'
],function(err){
  if(err){showErr('React failed to load. Check your internet connection.');return;}
  setBar(20,'Loading ReactDOM...');
  tryLoadScript([
    'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
    'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js'
  ],function(err2){
    if(err2){showErr('ReactDOM failed to load.');return;}
    setBar(35,'Loading Babel...');
    tryLoadScript([
      'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js',
      'https://unpkg.com/@babel/standalone@7.23.5/babel.min.js',
      'https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js'
    ],function(err3){
      if(err3){showErr('Babel failed to load. Try refreshing.');return;}
      setBar(50,'Fetching application...');
      fetch('./SAL_FX_BOT_INPUT.jsx?v='+Date.now())
        .then(function(r){
          if(!r.ok)throw new Error('JSX file not found ('+r.status+'). Check SAL_FX_BOT_INPUT.jsx is in the folder.');
          return r.text();
        })
        .then(function(jsx){
          setBar(65,'Compiling... (10-15 seconds for large app)');
          setTimeout(function(){
            var compiled;
            try{
              compiled=Babel.transform(jsx,{presets:['react'],filename:'app.jsx'}).code;
            }catch(ce){showErr('Compile error: '+ce.message);return;}
            setBar(85,'Running application...');
            setTimeout(function(){
              try{
                // eslint-disable-next-line no-new-func
                new Function(compiled)();
                var App=window.AxiomFX;
                if(!App){showErr('AxiomFX component not found after compile.');return;}
                setBar(100,'Launching...');
                setTimeout(function(){
                  document.getElementById('loading').style.display='none';
                  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
                },300);
              }catch(re){showErr('Runtime error: '+re.message);}
            },100);
          },100);
        })
        .catch(function(fe){showErr(fe.message);});
    });
  });
});
</script>
</body>
</html>
